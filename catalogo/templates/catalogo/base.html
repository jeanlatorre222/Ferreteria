<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Ferretería{% endblock %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar navbar-dark bg-dark navbar-expand-lg">
		<div class="container">
			<a class="navbar-brand" href="{% url 'lista_productos' %}">Ferretería</a>
			<div class="navbar-nav ms-auto">
				{% if user.is_authenticated %}
				<a class="nav-link" href="{% url 'crear_producto' %}">Crear Producto</a>
				<a class="nav-link" href="{% url 'logout' %}">Cerrar Sesión</a>
				{% else %}
				<a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Iniciar Sesión</a>
				{% endif %}
			</div>
		</div>
	</nav>

	<main class="container py-4">
		{% block content %}{% endblock %}
	</main>
</body>
</html>
